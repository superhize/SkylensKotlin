name: Build Dev Releases

on:
  push:
    branches: [ "1.21.11" ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle Caching
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the mod with Gradle
        run: ./gradlew build

      - name: Locate the built JAR file
        id: find_jar
        run: |
          JAR_PATH=$(find build/libs -name "*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" | head -n 1)
          echo "jar_path=$JAR_PATH" >> $GITHUB_ENV

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "2.1.3-alpha.${{ github.run_number }}"
          name: "Dev Build: 2.1.3-alpha.${{ github.run_number }}"
          prerelease: true
          files: ${{ env.jar_path }}
          body: |
            Automated development build for testing.
            **Commit:** ${{ github.sha }}
